services:
  - type: web
    name: mail-service
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /mail/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8095
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "COSMOS MEDICALS <onboarding@resend.dev>"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_EMAIL
        value: "guptasoftworks@gmail.com"
      - key: MAIL_FROM_NAME
        value: COSMOS Health (GUPTA SOFTWORKS ORGANISATION)
      - key: mail.simulate.if-empty
        value: "false"
